<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="t d">
  <title id="t">The default: a generated dental practice homepage with the six tells numbered</title>
  <desc id="d">A mock homepage for a fictional practice, SmileBright Dental Solutions, drawn to show what generated sites do: a purple to blue gradient hero, pill shaped buttons, a headline in a system font with one word in cursive, three floating shadowed cards, a second near identical section starting underneath, and copy that reads We leverage cutting-edge technology to deliver exceptional patient experiences. Green squares numbered 01 to 06 point at each tell.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#37b5ff"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#5bc4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1a1f4a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="860" fill="#f5f6fa"/>

  <!-- browser chrome -->
  <rect width="1200" height="44" fill="#e6e7ee"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <rect x="100" y="10" width="520" height="24" rx="12" fill="#ffffff"/>
  <text x="118" y="27" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#8a8fa3">smilebright-dental-solutions.com</text>

  <!-- hero -->
  <rect x="0" y="44" width="1200" height="352" fill="url(#hero)"/>
  <rect x="60" y="88" width="296" height="32" rx="16" fill="#ffffff" fill-opacity="0.22"/>
  <text x="80" y="109" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff">✨ Welcome to the future of dentistry</text>

  <text x="60" y="194" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#ffffff">Transform Your</text>
  <text x="60" y="264" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#ffffff">Smile <tspan font-family="'Segoe Script', 'Brush Script MT', 'Snell Roundhand', 'Apple Chancery', cursive" font-style="italic" font-weight="400" font-size="68" fill="#ffe27a">Journey</tspan></text>

  <text x="60" y="302" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" fill-opacity="0.92">We leverage cutting-edge technology to deliver exceptional patient</text>
  <text x="60" y="326" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" fill-opacity="0.92">experiences and empower your journey to optimal oral wellness.</text>

  <rect x="60" y="346" width="168" height="42" rx="21" fill="#ffffff"/>
  <text x="86" y="373" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#5b4df0">Get Started →</text>
  <rect x="242" y="346" width="142" height="42" rx="21" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="270" y="373" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Learn More</text>

  <!-- rating card -->
  <rect x="820" y="104" width="320" height="230" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <text x="850" y="156" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#1f2340">⭐ 4.9</text>
  <text x="850" y="184" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6b7080">500+ Happy Patients</text>
  <rect x="850" y="206" width="260" height="1" fill="#eceef5"/>
  <text x="850" y="244" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2340">🏆 Award-Winning Care</text>
  <text x="850" y="276" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2340">💙 Trusted by Families</text>
  <text x="850" y="308" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2340">🔒 Safe &amp; Secure</text>

  <!-- why choose us -->
  <text x="600" y="456" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1f2340">Why Choose Us?</text>
  <text x="600" y="484" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080">Our client-centric approach ensures seamless solutions tailored to your unique needs.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="512" width="330" height="184" rx="18" fill="#ffffff"/>
    <rect x="435" y="512" width="330" height="184" rx="18" fill="#ffffff"/>
    <rect x="790" y="512" width="330" height="184" rx="18" fill="#ffffff"/>
  </g>
  <rect x="108" y="540" width="44" height="44" rx="12" fill="url(#icon)"/>
  <text x="121" y="570" font-size="20">✨</text>
  <text x="108" y="618" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2340">Advanced Technology</text>
  <text x="108" y="644" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080">State-of-the-art equipment for</text>
  <text x="108" y="664" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080">optimal outcomes.</text>

  <rect x="463" y="540" width="44" height="44" rx="12" fill="url(#icon)"/>
  <text x="476" y="570" font-size="20">💙</text>
  <text x="463" y="618" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2340">Compassionate Care</text>
  <text x="463" y="644" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080">A patient-first philosophy at</text>
  <text x="463" y="664" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080">every touchpoint.</text>

  <rect x="818" y="540" width="44" height="44" rx="12" fill="url(#icon)"/>
  <text x="831" y="570" font-size="20">🔒</text>
  <text x="818" y="618" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2340">Trusted &amp; Secure</text>
  <text x="818" y="644" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080">Your peace of mind is our</text>
  <text x="818" y="664" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7080">top priority.</text>

  <!-- the next section, identical, beginning again -->
  <text x="600" y="772" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#1f2340">Our Services</text>
  <text x="600" y="800" text-anchor="middle" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#6b7080">Comprehensive solutions designed to elevate your experience.</text>
  <g filter="url(#shadow)">
    <rect x="80" y="828" width="330" height="184" rx="18" fill="#ffffff"/>
    <rect x="435" y="828" width="330" height="184" rx="18" fill="#ffffff"/>
    <rect x="790" y="828" width="330" height="184" rx="18" fill="#ffffff"/>
  </g>

  <!-- callouts: the six tells, numbered to match the list on the page -->
  <g font-family="'Arial Narrow', Impact, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#031408" text-anchor="middle">
    <rect x="394" y="346" width="42" height="42" fill="#2fe66f"/><text x="415" y="374">01</text>
    <rect x="1142" y="54" width="42" height="42" fill="#2fe66f"/><text x="1163" y="82">02</text>
    <rect x="444" y="224" width="42" height="42" fill="#2fe66f"/><text x="465" y="252">03</text>
    <rect x="1142" y="744" width="42" height="42" fill="#2fe66f"/><text x="1163" y="772">04</text>
    <rect x="1126" y="518" width="42" height="42" fill="#2fe66f"/><text x="1147" y="546">05</text>
    <rect x="668" y="282" width="42" height="42" fill="#2fe66f"/><text x="689" y="310">06</text>
  </g>
</svg>
